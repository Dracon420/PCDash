; PCDash K-Touch firmware (BigTreeTech K-Touch / Panda Touch hardware:
; ESP32-S3, 16 MB QIO flash, 8 MB octal PSRAM, 5" 800x480 16-bit RGB panel, GT911 touch).
; Pin map and panel timings from fmauNeko/pandatouch-bsp (MIT), doc/HARDWARE.md.
;
; Original firmware is backed up in ..\ktouch-backup\ (full 16 MB image).

[platformio]
default_envs = hwtest

[env]
platform          = espressif32@6.4.0
framework         = arduino
board             = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
upload_speed      = 460800
monitor_speed     = 115200
build_flags       = -DBOARD_HAS_PSRAM
                    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps          = moononournation/GFX Library for Arduino@1.4.7

; Step 1: prove the display + touch pins before building the real app.
[env:hwtest]
build_src_filter  = +<hwtest.cpp>

; The app: Games / Servers / Stream / PC tabs, fed by the PCDash dashboard over WiFi.
[env:app]
build_src_filter  = +<app/>
build_flags       = ${env.build_flags}
                    -DLV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"
                    -Iinclude
                    '-DFW_VERSION="PCDash-ktouch 1.6-watchdog"'  ; BTT's AsyncElegantOTA fork reports this at /update/identity
lib_deps          = ${env.lib_deps}
                    lvgl=https://github.com/lvgl/lvgl/archive/refs/tags/v8.3.7.zip
                    bblanchon/ArduinoJson@^6.21.5
                    tzapu/WiFiManager@2.0.17
                    ottowinter/ESPAsyncWebServer-esphome @ ^3.0.0
                    https://github.com/bigtreetech/AsyncElegantOTA.git
