<!doctype html>
<html><head><meta charset="utf-8"><title>GameArt</title>
<style>
  :root { --cyan:#00f0ff; --yellow:#fcee0a; --magenta:#ff2a6d; --bg:#040509; }
  html,body { margin:0; height:100%; background:#000; overflow:hidden; cursor:none; }
  .slide { position:absolute; inset:0; background:#000 center/cover no-repeat; opacity:0;
           will-change: transform, opacity; }
  #label { position:absolute; z-index:5; padding:14px 26px 18px; background:rgba(4,5,9,.62);
           border:1px solid rgba(0,240,255,.55); opacity:0; transition:opacity 1.2s;
           clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
           font-family: Bahnschrift, "Segoe UI", sans-serif; }
  #clock { color:var(--cyan); font-size:56px; font-weight:300; line-height:1.05;
           text-shadow: 1px 0 rgba(255,42,109,.55), -1px 0 rgba(0,240,255,.55); }
  #game  { color:var(--yellow); font-size:26px; font-weight:600; letter-spacing:.08em; }
  .portrait #clock { font-size:64px; } .portrait #game { font-size:28px; }
</style></head>
<body>
<div id="a" class="slide"></div><div id="b" class="slide"></div>
<div id="label"><div id="clock"></div><div id="game"></div></div>
<script>
const q = new URLSearchParams(location.search);
const idx = +(q.get("i") || 0), portrait = q.get("o") === "portrait";
document.title = "GameArt-" + idx;
if (portrait) document.body.classList.add("portrait");
// Each screen gets its own random sequence (shared seed + screen number).
let s = (+(q.get("seed") || Date.now()) + idx * 7919) >>> 0;
const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);

let art = [], slideMs = 20000, last = null, corner = idx % 4, front = "a";
const clock = document.getElementById("clock"), label = document.getElementById("label");
const tick = () => clock.textContent = new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
tick(); setInterval(tick, 1000);

for (let k = 0; k < 8; k++) rnd();   // spread the screens' sequences apart
let first = true;
function pick() {
  if (first) {   // each screen opens on a different game
    first = false;
    const games = [...new Set(art.map(a => a.game))].sort();
    const base = (+(q.get("seed") || 0)) % games.length;
    last = games[(base + idx + games.length - 1) % games.length];   // "last" = the one before this screen's start game
    const want = games[(base + idx) % games.length];
    const mine = art.filter(a => a.game === want && (portrait ? true : !a.portrait));
    const pref = portrait ? mine.filter(a => a.portrait) : mine;
    const from = pref.length ? pref : mine;
    if (from.length) return from[Math.floor(rnd() * from.length)];
  }
  const pool = art.filter(a => a.game !== last);
  const list = pool.length ? pool : art, w = [];
  for (const a of list) {
    const n = portrait ? (a.portrait ? 6 : 1) : (a.portrait ? 0 : 1);
    for (let k = 0; k < n; k++) w.push(a);
  }
  const from = w.length ? w : list;
  return from[Math.floor(rnd() * from.length)];
}

async function next() {
  const a = pick(); if (!a) return;
  const img = new Image(); img.src = a.url;
  try { await img.decode(); } catch { art = art.filter(x => x !== a); return next(); }
  last = a.game;
  const el = document.getElementById(front === "a" ? "b" : "a"), old = document.getElementById(front);
  front = el.id;
  el.style.backgroundImage = `url("${a.url}")`;
  // Slow pan + zoom (GPU transform), never the same direction twice in a row.
  const zin = rnd() < .5, z0 = zin ? 1.04 : 1.16, z1 = zin ? 1.16 : 1.04;
  const dx = (rnd() - .5) * 6, dy = (rnd() - .5) * 6, total = slideMs + 4000;
  el.getAnimations().forEach(x => x.cancel());
  el.animate([{transform:`scale(${z0}) translate(${-dx}%, ${-dy}%)`}, {transform:`scale(${z1}) translate(${dx}%, ${dy}%)`}],
             {duration: total, easing: "linear", fill: "forwards"});
  el.style.zIndex = 2; old.style.zIndex = 1;
  el.animate([{opacity:0},{opacity:1}], {duration: 2000, fill: "forwards"});
  setTimeout(() => { old.getAnimations().forEach(x => x.cancel()); old.style.opacity = 0; }, 2300);
  // Label: fade out, jump to another corner, fade in with the new game.
  label.style.opacity = 0;
  setTimeout(() => {
    corner = (corner + 1 + Math.floor(rnd() * 3)) % 4;
    const m = portrait ? "70px" : "56px";
    label.style.left = corner % 2 === 0 ? m : ""; label.style.right = corner % 2 ? m : "";
    label.style.bottom = corner < 2 ? m : ""; label.style.top = corner >= 2 ? m : "";
    document.getElementById("game").textContent = "▸ " + a.title.toUpperCase();
    label.style.opacity = 1;
  }, 1300);
}

fetch("/api/saver/art").then(r => r.json()).then(d => {
  art = d.art; slideMs = (d.slide_seconds || 20) * 1000;
  next(); setInterval(next, slideMs);
});
</script>
</body></html>
